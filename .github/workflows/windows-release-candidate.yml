name: Windows Release Candidate

on:
  workflow_dispatch:
  push:
    branches: [feature/phase38-installer-real]
    tags:
      - 'v1.0.0-rc.*'

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    env:
      WEBVIEW2_VERSION: '1.0.4258.31'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Download pinned WebView2 SDK
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP "Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION.nupkg"
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$env:WEBVIEW2_VERSION" -OutFile $sdk
          $extract = Join-Path $env:RUNNER_TEMP "webview2-sdk"
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -LiteralPath $sdk -DestinationPath $extract
          $include = Join-Path $extract "build/native/include"
          $lib = Join-Path $extract "build/native/x64"
          if (-not (Test-Path (Join-Path $include "WebView2.h"))) { throw "WebView2.h missing from pinned SDK." }
          if (-not (Test-Path (Join-Path $lib "WebView2LoaderStatic.lib"))) { throw "WebView2LoaderStatic.lib missing from pinned SDK." }
          "WEBVIEW2_SDK_DIR=$extract" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Configure Release
        shell: pwsh
        run: cmake -S . -B build-release -G 'Visual Studio 18 2026' -A x64 -DWEBVIEW2_SDK_DIR="$env:WEBVIEW2_SDK_DIR"

      - name: Build Release
        shell: pwsh
        run: cmake --build build-release --config Release --parallel

      - name: Run CTest
        shell: pwsh
        run: ctest --test-dir build-release -C Release --output-on-failure

      - name: Run UI contract tests
        shell: pwsh
        run: |
          node ui/ui_contract_test.mjs
          node ui/ui_bridge_contract_test.mjs

      - name: Run Windows host self-test and contracts
        shell: pwsh
        run: |
          $exe = Resolve-Path "build-release/src/MouseEngine.Host.Windows/Release/MouseEngine.Host.Windows.exe"
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Host self-test failed with code $LASTEXITCODE" }
          $snapshot = & $exe --snapshot | ConvertFrom-Json
          if ($snapshot.mutation.allowed -ne $false) { throw 'Mutation policy must remain denied.' }
          if ($snapshot.observedInput.session.traceAvailable -ne $false) { throw 'Inactive session trace must remain unavailable.' }
          if ($snapshot.observedInput.session.tracePacketCount -ne 0) { throw 'Inactive session trace packet count must remain zero.' }
          if ($snapshot.observedInput.session.traceTruncated -ne $false) { throw 'Inactive session trace truncation must remain false.' }
          if ($snapshot.observedInput.session.traceDroppedPackets -ne 0) { throw 'Inactive session trace dropped packet count must remain zero.' }
          if ($snapshot.observedInput.session.timelineAvailable -ne $false) { throw 'Inactive session timeline must remain unavailable.' }
          if ($snapshot.observedInput.session.anomalies -isnot [array]) { throw 'Persisted anomaly ledger must be an array.' }
          foreach ($anomaly in $snapshot.observedInput.session.anomalies) {
            foreach ($field in @('id','severity','type','message','stream','packetIndex','timestampMs')) {
              if ($null -eq $anomaly.$field) { throw "Persisted anomaly field missing: $field" }
            }
            if ($anomaly.packetIndex -lt 0) { throw 'Persisted anomaly packet index must be non-negative.' }
            if ([double]::IsNaN([double]$anomaly.timestampMs) -or [double]::IsInfinity([double]$anomaly.timestampMs)) { throw 'Persisted anomaly timestamp must be finite.' }
          }
          if ($snapshot.identity.transport -ne 'per-device') { throw 'Transport must remain per-device.' }
          foreach ($identity in $snapshot.device.identities) {
            if ($identity.resolved -and $identity.transport -notin @('Usb', 'Bluetooth', 'Unknown')) { throw 'Unexpected direct transport classification.' }
            if ($identity.resolved -and [string]::IsNullOrWhiteSpace($identity.topologyHash)) { throw 'Resolved identity must carry topology evidence.' }
            if ($null -eq $identity.usbEndpoint) { throw 'Identity must carry USB endpoint evidence state.' }
            if ($identity.usbEndpoint.connectionIndex -isnot [int] -or $identity.usbEndpoint.connectionIndex -lt 0) { throw 'USB connection index must be non-negative.' }
            if ($identity.usbEndpoint.speedCode -isnot [int] -or $identity.usbEndpoint.speedCode -lt 0) { throw 'USB speed code must be non-negative.' }
            if ($identity.usbEndpoint.deviceAddress -isnot [int] -or $identity.usbEndpoint.deviceAddress -lt 0) { throw 'USB device address must be non-negative.' }
            if ($identity.usbEndpoint.interruptInEndpointCount -isnot [int] -or $identity.usbEndpoint.interruptInEndpointCount -lt 0) { throw 'USB endpoint count must be non-negative.' }
            if ($identity.usbEndpoint.configuredInterval.available -ne $false) { throw 'Configured interval must remain unavailable.' }
            if ($identity.usbEndpoint.descriptorInterval.available -and ($identity.usbEndpoint.descriptorInterval.value -lt 0 -or $identity.usbEndpoint.descriptorInterval.value -gt 255)) { throw 'Descriptor bInterval must be an unsigned byte.' }
            if ($null -eq $identity.observedInput) { throw 'Identity must carry observed input state.' }
            if ([string]::IsNullOrWhiteSpace($identity.observedInput.scope)) { throw 'Observed timing scope must be explicit.' }
            if ($null -eq $identity.observedInput.session) { throw 'Observed input must carry session state.' }
            if ($identity.observedInput.session.active -isnot [bool]) { throw 'Session active state must be boolean.' }
            if ($identity.observedInput.session.packetCount -lt 0) { throw 'Session packet count must be non-negative.' }
            if ($identity.observedInput.session.durationMs -lt 0) { throw 'Session duration must be non-negative.' }
            if ($identity.observedInput.session.traceAvailable -isnot [bool]) { throw 'Active trace availability must be boolean.' }
            if ($identity.observedInput.session.tracePacketCount -lt 0) { throw 'Active trace packet count must be non-negative.' }
            foreach ($streamName in @('all','movement','button','wheel')) {
              $stream = $identity.observedInput.streams.$streamName
              if ($null -eq $stream) { throw "Observed stream missing: $streamName" }
              if ($stream.packetCount -lt 0) { throw "Observed packet count must be non-negative: $streamName" }
              if ($null -eq $stream.timing) { throw "Observed timing summary missing: $streamName" }
              if ($null -eq $stream.activity) { throw "Observed activity summary missing: $streamName" }
              if ($stream.activity.activeRunCount -lt 0 -or $stream.activity.longestActiveRunPackets -lt 0 -or $stream.activity.longestActiveRunMs -lt 0 -or $stream.activity.currentRunPackets -lt 0 -or $stream.activity.currentRunDurationMs -lt 0 -or $stream.activity.idleGapThresholdMs -lt 0) { throw "Observed activity values must be non-negative: $streamName" }
              if ($stream.timing.intervalCount -lt 0 -or $stream.timing.minIntervalMs -lt 0 -or $stream.timing.medianIntervalMs -lt 0 -or $stream.timing.p95IntervalMs -lt 0 -or $stream.timing.maxIntervalMs -lt 0 -or $stream.timing.jitterP95MinusMedianMs -lt 0 -or $stream.timing.idleGapCount50ms -lt 0 -or $stream.timing.longestIdleGapMs -lt 0) { throw "Observed timing values must be non-negative: $streamName" }
            }
          }
          $storage = & $exe --print-storage | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($storage.workspaceRoot)) { throw 'Workspace root must be reported.' }
          if ([string]::IsNullOrWhiteSpace($storage.cacheRoot)) { throw 'Cache root must be reported.' }
          if ($storage.workspaceRoot -notmatch 'Documents[\\/]Mouse Engine') { throw 'Workspace root must live under Documents\\Mouse Engine.' }
          if ($storage.cacheRoot -notmatch 'LocalAppData[\\/]Mouse Engine') { throw 'Cache root must live under LocalAppData\\Mouse Engine.' }
          Write-Output 'host_snapshot_contract: PASS'
          Write-Output 'local_workspace_contract: PASS'

      - name: Package Windows distribution
        shell: pwsh
        run: python tools/package_windows.py --source . --host-executable ./build-release/src/MouseEngine.Host.Windows/Release/MouseEngine.Host.Windows.exe --output ./MouseEngine-1.0.0-rc.3-win64.zip

      - name: Validate Windows distribution package
        shell: pwsh
        run: |
          python tools/package_windows_tests.py
          python tools/release_gate.py
          Expand-Archive -LiteralPath ./MouseEngine-1.0.0-rc.3-win64.zip -DestinationPath ./package-smoke -Force
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/windows_installer_smoke.ps1 -DistributionRoot './package-smoke/Mouse Engine'
          Get-FileHash ./MouseEngine-1.0.0-rc.3-win64.zip -Algorithm SHA256 | Format-List

      - name: Build Windows installer
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/build_windows_installer.ps1

      - name: Run Windows installer runtime smoke
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/windows_installer_runtime_smoke.ps1 -InstallerPath './dist/MouseEngine-1.0.0-rc.3-win64-setup.exe'

      - name: Upload Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: MouseEngine-1.0.0-rc.3-win64
          path: |
            MouseEngine-1.0.0-rc.3-win64.zip
            dist/MouseEngine-1.0.0-rc.3-win64-setup.exe
          if-no-files-found: error
          retention-days: 30
