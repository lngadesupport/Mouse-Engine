name: Windows Release Candidate

on:
  push:
    branches: [feature/phase38-installer-real]
    tags:
      - 'v1.0.0-rc.*'

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      WEBVIEW2_VERSION: '1.0.4258.31'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Download pinned WebView2 SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = Join-Path $env:RUNNER_TEMP 'webview2-sdk'
          New-Item -ItemType Directory -Force -Path $sdk | Out-Null
          $nupkg = Join-Path $env:RUNNER_TEMP "Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION.nupkg"
          $sdkZip = Join-Path $env:RUNNER_TEMP "Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION.zip"
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$env:WEBVIEW2_VERSION" -OutFile $nupkg
          Copy-Item -LiteralPath $nupkg -Destination $sdkZip -Force
          Expand-Archive -LiteralPath $sdkZip -DestinationPath $sdk -Force
          "WEBVIEW2_SDK_DIR=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if (-not (Test-Path (Join-Path $sdk 'build/native/include/WebView2.h'))) { throw 'WebView2.h missing from SDK' }
          if (-not (Test-Path (Join-Path $sdk 'build/native/x64/WebView2LoaderStatic.lib'))) { throw 'WebView2LoaderStatic.lib missing from SDK' }

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-release -G 'Visual Studio 18 2026' -A x64 -DWEBVIEW2_SDK_DIR="$env:WEBVIEW2_SDK_DIR"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build-release --config Release --parallel

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build-release -C Release --output-on-failure

      - name: UI contract test
        shell: pwsh
        run: |
          node ui/ui_contract_test.mjs

      - name: WebView2 bridge contract test
        shell: pwsh
        run: |
          node ui/ui_bridge_contract_test.mjs

      - name: Host self-test
        shell: pwsh
        run: |
          ./build-release/src/MouseEngine.Host.Windows/Release/MouseEngine.Host.Windows.exe --self-test
          ./build-release/src/MouseEngine.Host.Windows/Release/MouseEngine.Host.Windows.exe --print-environment
          ./build-release/src/MouseEngine.Host.Windows/Release/MouseEngine.Host.Windows.exe --print-storage
          $snapshot = ./build-release/src/MouseEngine.Host.Windows/Release/MouseEngine.Host.Windows.exe --print-snapshot | ConvertFrom-Json
          if ($snapshot.schemaVersion -ne 1) { throw 'Snapshot schema version mismatch.' }
          if ($snapshot.host.online -ne $true) { throw 'Host snapshot is not online.' }
          if ($snapshot.device.observationAvailable -isnot [bool]) { throw 'Device observation availability must be boolean.' }
          if ($snapshot.device.connected -isnot [bool]) { throw 'Device connection state must be boolean.' }
          if ($snapshot.device.mouseCount -isnot [int] -or $snapshot.device.mouseCount -lt 0) { throw 'Mouse count must be a non-negative integer.' }
          if ($snapshot.device.detailAvailable -isnot [bool]) { throw 'Device detail availability must be boolean.' }
          if ($snapshot.device.maxObservedButtons -isnot [int] -or $snapshot.device.maxObservedButtons -lt 0) { throw 'Observed button count must be a non-negative integer.' }
          if ($snapshot.device.maxObservedSampleRate -isnot [int] -or $snapshot.device.maxObservedSampleRate -lt 0) { throw 'Observed sample rate must be a non-negative integer.' }
          if ($snapshot.device.identityResolvedCount -isnot [int] -or $snapshot.device.identityResolvedCount -lt 0) { throw 'Resolved identity count must be a non-negative integer.' }
          if ($snapshot.device.identities -isnot [array]) { throw 'Identity observations must be an array.' }
          if ($snapshot.identity.available -isnot [bool]) { throw 'Identity availability must be boolean.' }
          if ($snapshot.identity.transport -ne 'per-device') { throw 'Transport must remain per-device; no global transport claim is permitted.' }
          foreach ($identity in $snapshot.device.identities) {
            if ($identity.resolved -and $identity.transport -notin @('Usb', 'Bluetooth', 'Unknown')) { throw 'Unexpected direct transport classification.' }
            if ($identity.resolved -and [string]::IsNullOrWhiteSpace($identity.topologyHash)) { throw 'Resolved identity must carry a topology evidence hash.' }
          }
          if ($snapshot.mutation.allowed -ne $false) { throw 'Mutation policy must remain denied.' }
          Write-Output 'host_snapshot_contract: PASS'

      - name: Validate Windows host binary
        shell: pwsh
        run: |
          $exe = Resolve-Path './build-release/src/MouseEngine.Host.Windows/Release/MouseEngine.Host.Windows.exe'
          $dump = & dumpbin.exe /headers $exe 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin failed for host executable.' }
          if (-not ($dump | Select-String '8664 machine \(x64\)')) { throw 'Host executable is not a validated x64 PE binary.' }
          Write-Output 'windows_host_pe_x64: PASS'

      - name: Package Windows distribution
        shell: pwsh
        run: |
          python tools/package_windows.py --source . --host-executable ./build-release/src/MouseEngine.Host.Windows/Release/MouseEngine.Host.Windows.exe --output ./MouseEngine-1.0.0-rc.3-win64.zip

      - name: Verify package archive
        shell: pwsh
        run: |
          python tools/package_windows_tests.py
          python tools/release_gate.py
          Expand-Archive -LiteralPath ./MouseEngine-1.0.0-rc.3-win64.zip -DestinationPath ./package-smoke -Force
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/windows_installer_smoke.ps1 -DistributionRoot './package-smoke/Mouse Engine'
          Get-FileHash ./MouseEngine-1.0.0-rc.3-win64.zip -Algorithm SHA256 | Format-List

      - name: Build Windows installer
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/build_windows_installer.ps1

      - name: Upload Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: MouseEngine-1.0.0-rc.3-win64
          path: |
            MouseEngine-1.0.0-rc.3-win64.zip
            dist/MouseEngine-1.0.0-rc.3-win64-setup.exe
          if-no-files-found: error
          retention-days: 30
